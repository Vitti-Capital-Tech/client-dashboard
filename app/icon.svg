<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Solid Dark Navy Circular Badge / Background -->
  <circle cx="256" cy="256" r="236" fill="#0B132B" stroke="#1E293B" stroke-width="8" />
  
  <g transform="translate(0, 5)">
    <!-- Candle 1: Red (Bearish) -->
    <line x1="140" y1="210" x2="140" y2="350" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
    <rect x="126" y="240" width="28" height="80" rx="4" fill="#EF4444"/>

    <!-- Candle 2: Green (Bullish) -->
    <line x1="198" y1="180" x2="198" y2="340" stroke="#22C55E" stroke-width="6" stroke-linecap="round"/>
    <rect x="184" y="200" width="28" height="110" rx="4" fill="#22C55E"/>

    <!-- Candle 3: Green (Tall Bullish) -->
    <line x1="256" y1="130" x2="256" y2="370" stroke="#10B981" stroke-width="6" stroke-linecap="round"/>
    <rect x="242" y="150" width="28" height="180" rx="4" fill="#10B981"/>

    <!-- Candle 4: Red (Bearish Drop) -->
    <line x1="314" y1="190" x2="314" y2="350" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
    <rect x="300" y="210" width="28" height="100" rx="4" fill="#EF4444"/>

    <!-- Candle 5: Green (Bullish Rebound) -->
    <line x1="372" y1="170" x2="372" y2="330" stroke="#22C55E" stroke-width="6" stroke-linecap="round"/>
    <rect x="358" y="190" width="28" height="110" rx="4" fill="#22C55E"/>

    <!-- Glowing Cyan IV Line Curve -->
    <path d="M 100,320 C 130,310 160,250 198,220 C 230,195 242,160 256,150 C 270,160 290,260 314,260 C 340,260 355,220 412,230" 
          fill="none" stroke="#06B6D4" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 100,320 C 130,310 160,250 198,220 C 230,195 242,160 256,150 C 270,160 290,260 314,260 C 340,260 355,220 412,230" 
          fill="none" stroke="#22D3EE" stroke-width="6" stroke-linecap="round"/>
  </g>

  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
</svg>
